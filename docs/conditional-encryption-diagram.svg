<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">Conditional Encryption core primitive</title>
  <desc id="desc">Hidden encrypted message and control message enter a predicate gate. A payload gift message enters the same gate from bottom to top. If the predicate holds, the payload decrypts; otherwise decryption returns an unrelated random message.</desc>
  <defs>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f9ff"/>
    </linearGradient>
    <linearGradient id="lockBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7de1"/>
      <stop offset="1" stop-color="#1f58b8"/>
    </linearGradient>
    <linearGradient id="giftPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b6ee8"/>
      <stop offset="1" stop-color="#6d43c5"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#54c46d"/>
      <stop offset="1" stop-color="#18883b"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L9,5 L1,9 Z" fill="#2962b5"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L9,5 L1,9 Z" fill="#15803d"/>
    </marker>
    <marker id="arrowDark" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L9,5 L1,9 Z" fill="#111827"/>
    </marker>
    <style>
      .label{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#111827}
      .small{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#334155}
      .mini{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#64748b}
      .code{font:700 16px "SFMono-Regular",Consolas,monospace;fill:#111827}
      .greenText{font:700 16px "SFMono-Regular",Consolas,monospace;fill:#15803d}
      .redText{font:700 16px "SFMono-Regular",Consolas,monospace;fill:#dc2626}
      .gateText{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#12621f}
      .gateBox{fill:url(#gate);stroke:#8a9ab2;stroke-width:1.7;filter:url(#softShadow)}
      .dashBlue{stroke:#2b6cc5;stroke-width:3.2;stroke-linecap:round;stroke-dasharray:5 11;fill:none;marker-end:url(#arrowBlue)}
      .dashGreen{stroke:#159447;stroke-width:3.2;stroke-linecap:round;stroke-dasharray:5 11;fill:none;marker-end:url(#arrowGreen)}
      .solidGreen{stroke:#15803d;stroke-width:3;stroke-linecap:round;fill:none;marker-end:url(#arrowGreen)}
      .solidDark{stroke:#111827;stroke-width:3;stroke-linecap:round;fill:none;marker-end:url(#arrowDark)}
      .thinDash{stroke:#7c8ba1;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:6 8;fill:none;marker-end:url(#arrowBlue)}
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="390" rx="34" fill="rgba(255,255,255,0)"/>

  <!-- Hidden message lock -->
  <text x="80" y="42" text-anchor="middle" class="label">Hidden Message</text>
  <g transform="translate(54 76)">
    <path d="M16 30 v-15 c0-17 12-29 29-29s29 12 29 29v15" fill="none" stroke="#2464c8" stroke-width="9" stroke-linecap="round"/>
    <rect x="6" y="28" width="78" height="62" rx="11" fill="url(#lockBlue)"/>
    <circle cx="45" cy="57" r="8" fill="#fff"/>
    <rect x="41" y="58" width="8" height="17" rx="3" fill="#fff"/>
  </g>
  <text x="80" y="187" text-anchor="middle" class="code">Enc(pk, m₁)</text>

  <!-- Control key -->
  <text x="235" y="42" text-anchor="middle" class="label">Control Message</text>
  <g transform="translate(204 83) rotate(-38 35 35)">
    <circle cx="28" cy="28" r="19" fill="#45bb65"/>
    <circle cx="28" cy="28" r="7" fill="#def7e6"/>
    <rect x="43" y="23" width="58" height="11" rx="5" fill="#2fa44f"/>
    <rect x="77" y="34" width="10" height="18" rx="2" fill="#2fa44f"/>
    <rect x="94" y="34" width="10" height="14" rx="2" fill="#2fa44f"/>
  </g>
  <text x="235" y="187" text-anchor="middle" class="code">m₂</text>

  <!-- Arrows into gate -->
  <path d="M134 115 C190 115 246 115 302 115" class="dashBlue"/>
  <path d="M267 115 C302 115 326 115 356 115" class="dashGreen"/>

  <!-- Predicate gate -->
  <rect x="365" y="58" width="220" height="228" rx="22" class="gateBox"/>
  <text x="475" y="92" text-anchor="middle" class="label">Predicate</text>
  <text x="475" y="130" text-anchor="middle" class="code">P(m₁, m₂)</text>
  <text x="475" y="170" text-anchor="middle" class="gateText">Equality</text>
  <text x="475" y="200" text-anchor="middle" class="gateText">Edit Distance ≤ 1</text>
  <text x="475" y="230" text-anchor="middle" class="gateText">Hamming Distance ≤ ℓ</text>
  <text x="475" y="260" text-anchor="middle" class="gateText">CAPSLOCK or OR</text>

  <!-- Payload gift bottom-to-top -->
  <g transform="translate(445 303)">
    <text x="30" y="0" text-anchor="middle" class="label">Payload</text>
    <rect x="8" y="22" width="44" height="36" rx="5" fill="url(#giftPurple)"/>
    <rect x="3" y="12" width="54" height="16" rx="4" fill="#b397f0"/>
    <rect x="26" y="12" width="8" height="46" rx="2" fill="#fff" opacity="0.85"/>
    <path d="M30 12 C17 -6 4 1 15 12" fill="none" stroke="#6d43c5" stroke-width="5" stroke-linecap="round"/>
    <path d="M30 12 C43 -6 56 1 45 12" fill="none" stroke="#6d43c5" stroke-width="5" stroke-linecap="round"/>
    <text x="30" y="84" text-anchor="middle" class="code">m₃</text>
  </g>
  <line x1="475" y1="312" x2="475" y2="294" stroke="#3861a8" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="6 7"/>
  <path d="M475 287 L465 303 L485 303 Z" fill="#3861a8"/>

  <!-- Success branch -->
  <path d="M592 115 C625 115 635 111 657 106" class="solidGreen"/>
  <circle cx="692" cy="99" r="28" fill="url(#green)" filter="url(#softShadow)"/>
  <path d="M678 98 L688 110 L708 86" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="740" y="82" class="greenText">If P(m₁,m₂) = 1</text>
  <path d="M735 100 L875 100" class="solidDark"/>
  <g transform="translate(892 62)">
    <path d="M13 26 v-15 c0-15 11-26 26-26s26 11 26 26v15" fill="none" stroke="#7152bf" stroke-width="8" stroke-linecap="round"/>
    <rect x="4" y="25" width="66" height="58" rx="10" fill="#7e61cb"/>
    <circle cx="37" cy="53" r="7" fill="#fff"/>
    <rect x="34" y="54" width="7" height="15" rx="3" fill="#fff"/>
  </g>
  <text x="925" y="192" text-anchor="middle" class="label">Decrypts to</text>
  <text x="925" y="218" text-anchor="middle" class="label">payload m₃</text>

  <!-- Failure branch -->
  <path d="M592 205 C624 215 637 226 657 234" class="solidDark"/>
  <circle cx="692" cy="234" r="28" fill="#ef4444" filter="url(#softShadow)"/>
  <path d="M678 220 L706 248 M706 220 L678 248" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <text x="740" y="223" class="redText">If P(m₁,m₂) = 0</text>
  <path d="M735 245 L875 245" class="solidDark"/>
  <g transform="translate(892 206)">
    <path d="M13 26 v-15 c0-15 11-26 26-26s26 11 26 26v15" fill="none" stroke="#4b5563" stroke-width="8" stroke-linecap="round"/>
    <rect x="4" y="25" width="66" height="58" rx="10" fill="#50565e"/>
    <circle cx="37" cy="53" r="7" fill="#fff"/>
    <rect x="34" y="54" width="7" height="15" rx="3" fill="#fff"/>
  </g>
  <text x="925" y="333" text-anchor="middle" class="label">Decrypts to</text>
  <text x="925" y="358" text-anchor="middle" class="small">random message</text>
  <text x="925" y="379" text-anchor="middle" class="mini">unrelated to m₁,m₂,m₃</text>
</svg>
