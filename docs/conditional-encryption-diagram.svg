  <title
     id="title">Conditional Encryption core primitive</title>
  <desc
     id="desc">Hidden encrypted message and control message enter a predicate gate. A payload gift message enters the same gate from bottom to top. If the predicate holds, the payload decrypts; otherwise decryption returns an unrelated random message.</desc>
