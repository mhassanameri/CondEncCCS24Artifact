<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" role="img" aria-labelledby="title desc">
  <title id="title">Conditional Encryption concept diagram</title>
  <desc id="desc">A visual explanation of conditional encryption: an encrypted hidden message and a control message are checked by a predicate. If the predicate holds, the payload unlocks. If not, the ciphertext reveals no useful information. The same idea is shown as an application to typo-tolerant password checking.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef7f4"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2457c5"/>
      <stop offset="1" stop-color="#13a3a6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L8,5 L1,9 Z" fill="#3861a8"/>
    </marker>
    <style>
      .panel{fill:#fff;stroke:#dbe6f4;stroke-width:2;filter:url(#shadow)}
      .soft{fill:#f4f8fd;stroke:#dbe6f4;stroke-width:2}
      .title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#10223f}
      .h{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#10223f}
      .t{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#475569}
      .small{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#64748b}
      .code{font:700 14px "SFMono-Regular",Consolas,monospace;fill:#0f172a}
      .white{fill:#fff}
      .arrow{stroke:#3861a8;stroke-width:3;fill:none;marker-end:url(#arrow);stroke-linecap:round}
      .dash{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:6 7}
      .good{fill:#ecfdf3;stroke:#b7efcb;stroke-width:2}
      .bad{fill:#fff7ed;stroke:#fed7aa;stroke-width:2}
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="700" rx="34" fill="url(#bg)"/>
  <circle cx="110" cy="95" r="60" fill="#dbeafe" opacity="0.55"/>
  <circle cx="875" cy="590" r="82" fill="#ccfbf1" opacity="0.55"/>

  <text x="50" y="62" class="title">Conditional Encryption</text>
  <text x="50" y="92" class="t">A payload opens only when a hidden encrypted value satisfies a condition.</text>

  <rect x="50" y="125" width="880" height="315" rx="28" class="panel"/>
  <text x="85" y="166" class="h">Core primitive</text>

  <rect x="85" y="198" width="190" height="95" rx="18" class="soft"/>
  <text x="110" y="230" class="h">Hidden input</text>
  <text x="110" y="258" class="code">c₁ = Enc(pk, m₁)</text>
  <text x="110" y="278" class="small">m₁ stays encrypted</text>

  <rect x="85" y="322" width="190" height="65" rx="18" class="soft"/>
  <text x="110" y="350" class="h">Control</text>
  <text x="110" y="373" class="code">m₂</text>

  <path d="M280 246 C330 246, 335 275, 376 276" class="arrow"/>
  <path d="M280 354 C330 354, 335 310, 376 306" class="arrow"/>

  <rect x="380" y="215" width="225" height="135" rx="22" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="410" y="252" class="white" style="font:700 20px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">Predicate gate</text>
  <text x="410" y="285" class="white" style="font:700 17px 'SFMono-Regular',Consolas,monospace">P(m₁, m₂) ?</text>
  <text x="410" y="315" class="white" style="font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">Equality · edit distance ·</text>
  <text x="410" y="334" class="white" style="font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">Hamming distance · CAPSLOCK</text>

  <rect x="664" y="177" width="205" height="92" rx="18" class="good"/>
  <text x="690" y="210" class="h">If condition holds</text>
  <text x="690" y="239" class="code">Dec(c) = payload</text>

  <rect x="664" y="303" width="205" height="92" rx="18" class="bad"/>
  <text x="690" y="336" class="h">If it fails</text>
  <text x="690" y="364" class="code">payload hidden</text>
  <text x="690" y="383" class="small">even with the secret key</text>

  <path d="M608 259 C635 237, 635 225, 660 223" class="arrow"/>
  <path d="M608 300 C637 318, 637 347, 660 349" class="arrow"/>

  <rect x="50" y="475" width="880" height="170" rx="28" class="panel"/>
  <text x="85" y="516" class="h">TypTop password-typo application</text>
  <text x="85" y="544" class="t">The server can accept a plausible typo while avoiding unrelated password leakage.</text>

  <rect x="105" y="585" width="150" height="42" rx="21" class="soft"/>
  <text x="130" y="611" class="code">stored pwd</text>
  <path d="M260 606 L345 606" class="arrow"/>

  <rect x="350" y="576" width="190" height="60" rx="20" fill="#f8fafc" stroke="#d8e3f1" stroke-width="2"/>
  <text x="377" y="601" class="code">typo predicate</text>
  <text x="392" y="622" class="small">close enough?</text>
  <path d="M545 606 L635 606" class="arrow"/>

  <rect x="640" y="585" width="180" height="42" rx="21" fill="#ecfdf3" stroke="#b7efcb" stroke-width="2"/>
  <text x="666" y="611" class="code">safe correction</text>

  <path d="M180 584 C220 545, 310 542, 383 574" class="dash"/>
  <path d="M730 584 C765 550, 825 550, 860 575" class="dash"/>
  <text x="300" y="556" class="small">privacy-preserving check</text>
</svg>
